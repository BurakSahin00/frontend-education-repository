<nz-layout>
    <nz-header>
        <div class="logo">TODO App</div>
        <ul nz-menu nzTheme="dark" nzMode="horizontal" class="header-menu">
            <li nz-menu-item (click)="filterByOverdue()">Overdue Todos</li>
            <li nz-menu-item (click)="filterByUpcoming()">Upcoming Todos</li>
        </ul>
    </nz-header>
    <section>
        <nz-sider>
            <ul nz-menu nzTheme="dark" nzMode="inline" class="sider-menu">
                <li nz-submenu nzIcon="insert-row-left" nzTitle="Categories">
                    <ul>
                        <li nz-menu-item *ngFor="let category of userCategories(); trackBy: trackByCategoryId" (click)="filterByCategory(category.id)">{{ category?.name }}</li>
                    </ul>
                </li>
                <li nz-menu-item nzIcon="plus" (click)="addCategoryModal.open()">Add Category</li>
                <category-add-modal #addCategoryModal></category-add-modal>
                <li nz-submenu nzIcon="border" nzTitle="Priority">
                    <ul>
                        <li nz-menu-item *ngFor="let label of userLabels()" (click)="filterByPriority(label.id)">{{ label.name }}</li>
                    </ul>
                </li>
                <li nz-menu-item nzIcon="calendar" [routerLink]="['/app', 'calendar']">Calendar</li>
                <li nz-menu-item nzIcon="unordered-list" nzTitle="Todos" [routerLink]="['/app', 'todos']">Todos</li>
                <li nz-menu-item nzIcon="user" nzTitle="Dashboard" [routerLink]="['/app', 'dashboard']">Dashboard</li>
                <li nz-menu-item nzIcon="user" nzTitle="Profile" [routerLink]="['/app', 'profile']">Profile</li>
            </ul>
        </nz-sider>
        <nz-content>
            <router-outlet></router-outlet>
        </nz-content>
    </section>
</nz-layout>
