<section>
  <div class="header">
    <button nz-button nzType="primary" (click)="todoModalRef.openModal('ADD')">Add Todo</button>
    <todo-filter></todo-filter>
  </div>
  <!-- Aktif kategori başlığı ve açıklaması -->
  <div *ngIf="activeCategory() as cat" class="category-header">
    <div class="category-header-row">
      <div>
        <h2 class="category-title">{{ cat.name }}</h2>
        <p class="category-desc" *ngIf="cat.description">{{ cat.description }}</p>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;">
        <button nz-button nzType="default" (click)="categoryEditRef.open(cat)">Edit</button>
        <button nz-button nzType="default" nzDanger (click)="deleteCategory(cat.id)">Delete</button>
      </div>
    </div>
    <category-edit-modal #categoryEditRef [category]="cat"></category-edit-modal>
  </div>
<todo-modal #todoModalRef></todo-modal>

  <div class="list-container">
    <todo-list
      [todos]="todoList()"
      (editTodo)="todoModalRef.openModal('EDIT', $event)"
      (deleteTodo)="removeTodo($event)"
      (toggleComplete)="toggleTodoCompletion($event)">
    </todo-list>
  </div>
</section>
