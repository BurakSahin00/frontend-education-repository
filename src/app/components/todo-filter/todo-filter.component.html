<button nz-button nzType="primary" (click)="isVisible.set(true)">Filter Todos</button>

<nz-modal
  [nzVisible]="isVisible()"
  (nzVisibleChange)="isVisible.set($event)"
  nzTitle="Filter Todos"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
>

  <form [formGroup]="filterForm" *nzModalContent class="filter-form">
    <h4>Completion Status</h4>
    <nz-radio-group formControlName="completion">
      <label nz-radio [nzValue]="true">Completed</label>
      <label nz-radio [nzValue]="false">Not Completed</label>
    </nz-radio-group>

    <h4>Priority</h4>
    <nz-radio-group formControlName="priority">
      <label nz-radio [nzValue]="0">Low</label>
      <label nz-radio [nzValue]="1">Medium</label>
      <label nz-radio [nzValue]="2">High</label>
    </nz-radio-group>

    <h4>Category Selection</h4>
    <nz-select nzPlaceHolder="Select category" formControlName="category">
      <nz-option *ngFor="let category of categories()" [nzValue]="category.id" [nzLabel]="category.name"></nz-option>
    </nz-select>

    <h4>Due Date Range</h4>

    <h5>Start Date</h5>
    <input nz-input type="date" formControlName="startDate" />
    <h5>End Date</h5>
    <input nz-input type="date" formControlName="endDate" />
  </form>
</nz-modal>
