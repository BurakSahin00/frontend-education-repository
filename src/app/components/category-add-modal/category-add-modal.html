<nz-modal [nzVisible]="isVisible()"
  nzTitle="Add New Category"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
  [nzOkDisabled]="categoryForm.invalid">

  <form [formGroup]="categoryForm" *nzModalContent class="category-form">
    <label for="name">Category Name</label>
    <input nz-input id="name" formControlName="name" placeholder="Enter category name" />
    <div *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid" class="error">
      Category name is required and cannot be only spaces.
    </div>

    <label for="description">Description (Optional)</label>
    <textarea nz-input id="description" formControlName="description" placeholder="Enter category description"></textarea>
  </form>
</nz-modal>
